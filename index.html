<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Music Matcher</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --danger: #f87171;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 2rem;
      display: flex;
      justify-content: center;
    }

    .container {
      max-width: 850px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    header {
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 2.2rem;
      color: var(--accent);
    }

    header p {
      color: var(--text-muted);
      margin-top: 0.5rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
    }

    .controls-row {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    select {
      background: var(--bg-color);
      color: var(--text-main);
      border: 1px solid var(--border);
      padding: 0.5rem 1rem;
      border-radius: 6px;
      font-size: 1rem;
      outline: none;
      cursor: pointer;
    }

    .progression-display {
      min-height: 50px;
      background: var(--bg-color);
      border: 1px dashed var(--border);
      border-radius: 8px;
      display: flex;
      align-items: center;
      padding: 0.5rem 1rem;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .chord-tag {
      background: var(--accent);
      color: #000;
      font-weight: bold;
      padding: 0.4rem 0.8rem;
      border-radius: 6px;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      cursor: pointer;
      user-select: none;
      transition: all 0.15s ease;
    }

    .chord-tag:hover {
      background: var(--danger);
      color: #ffffff;
    }

    .chord-tag span {
      font-size: 0.8rem;
      opacity: 0.75;
    }

    .chord-group {
      margin-top: 1rem;
    }

    .chord-group label {
      display: block;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
      gap: 0.5rem;
    }

    button.btn-chord {
      background: var(--bg-color);
      color: var(--text-main);
      border: 1px solid var(--border);
      padding: 0.75rem 0.5rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.15s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    button.btn-chord:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    button.btn-chord span {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .actions {
      display: flex;
      gap: 0.5rem;
      margin-top: 1rem;
    }

    .btn-action {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 0.4rem 0.8rem;
      border-radius: 6px;
      cursor: pointer;
    }

    .btn-action:hover {
      color: var(--text-main);
      border-color: var(--text-main);
    }

    .matches-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }

    .match-item {
      padding: 0.85rem 0;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .match-item:last-child {
      border-bottom: none;
    }

    .match-title {
      font-weight: bold;
      font-size: 1.05rem;
    }

    .match-meta {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 0.2rem;
    }

    .genre-badge {
      background: var(--bg-color);
      border: 1px solid var(--border);
      color: var(--accent);
      font-size: 0.75rem;
      padding: 0.2rem 0.6rem;
      border-radius: 12px;
      text-transform: capitalize;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Music Matcher</h1>
      <p>Analyze chord progressions across classical, pop, rock, and film scores.</p>
    </header>

    <div class="card">
      <div class="controls-row">
        <label for="key-select"><strong>Selected Key:</strong></label>
        <select id="key-select">
          <option value="C">C Major</option>
          <option value="G">G Major</option>
          <option value="D">D Major</option>
          <option value="A">A Major</option>
          <option value="E">E Major</option>
          <option value="F">F Major</option>
          <option value="Bb">Bb Major</option>
          <option value="Eb">Eb Major</option>
        </select>
      </div>

      <div class="progression-display" id="progression-display">
        <span style="color: var(--text-muted);">Click chords below to build a progression...</span>
      </div>

      <div class="actions">
        <button class="btn-action" id="btn-play">▶ Play Sequence</button>
        <button class="btn-action" id="btn-clear">Clear</button>
      </div>

      <!-- Diatonic Chords -->
      <div class="chord-group">
        <label>Diatonic Chords</label>
        <div class="grid" id="diatonic-grid"></div>
      </div>

      <!-- Extensions & Variations -->
      <div class="chord-group">
        <label>Extensions & Variations</label>
        <div class="grid" id="extension-grid"></div>
      </div>

      <!-- Modal Interchange / Borrowed -->
      <div class="chord-group">
        <label>Borrowed Chords</label>
        <div class="grid" id="borrowed-grid"></div>
      </div>
    </div>

    <!-- Matches Output -->
    <div class="card">
      <div class="matches-header">
        <h2 style="margin: 0;">Matching Music (<span id="match-count">0</span>)</h2>
      </div>
      <div id="matches-list">
        <p style="color: var(--text-muted);">No matching songs found for this sequence yet.</p>
      </div>
    </div>
  </div>

  <script>
    const NOTES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
    const NOTE_ALIASES = { 'Db': 'C#', 'Eb': 'D#', 'Gb': 'F#', 'Ab': 'G#', 'Bb': 'A#' };

    const CHORD_DEFINITIONS = {
      'I':   { semitones: 0,  intervals: [0, 4, 7] },
      'ii':  { semitones: 2,  intervals: [0, 3, 7] },
      'iii': { semitones: 4,  intervals: [0, 3, 7] },
      'IV':  { semitones: 5,  intervals: [0, 4, 7] },
      'V':   { semitones: 7,  intervals: [0, 4, 7] },
      'vi':  { semitones: 9,  intervals: [0, 3, 7] },
      'vii°':{ semitones: 11, intervals: [0, 3, 6] },
      'Imaj7':{ semitones: 0, intervals: [0, 4, 7, 11] },
      'V7':   { semitones: 7, intervals: [0, 4, 7, 10] },
      'vi7':  { semitones: 9, intervals: [0, 3, 7, 10] },
      'iv':   { semitones: 5, intervals: [0, 3, 7] },
      'bVI':  { semitones: 8, intervals: [0, 4, 7] },
      'bVII': { semitones: 10, intervals: [0, 4, 7] }
    };

    const CHORD_GROUPS = {
      diatonic: ['I', 'ii', 'iii', 'IV', 'V', 'vi', 'vii°'],
      extension: ['Imaj7', 'V7', 'vi7'],
      borrowed: ['iv', 'bVI', 'bVII']
    };

    // Expanded Verified Database (Pop, Rock, Classical, Film)
    const SONG_DATABASE = [
      // Classical & Traditional
      { title: "Canon in D", artist: "Johann Pachelbel", genre: "classical", progression: ['I', 'V', 'vi', 'iii', 'IV', 'I', 'IV', 'V'] },
      { title: "Symphony No. 9 (Ode to Joy)", artist: "Ludwig van Beethoven", genre: "classical", progression: ['I', 'V', 'I', 'V'] },
      { title: "Air on the G String", artist: "J.S. Bach", genre: "classical", progression: ['I', 'V', 'vi', 'iii', 'IV'] },
      { title: "Clair de Lune", artist: "Claude Debussy", genre: "classical", progression: ['I', 'IV', 'Imaj7'] },
      { title: "Prelude in C Major (BWV 846)", artist: "J.S. Bach", genre: "classical", progression: ['I', 'ii', 'V7', 'I'] },

      // Pop & Rock (I–V–vi–IV Axis of Awesome variations)
      { title: "Let It Be", artist: "The Beatles", genre: "pop", progression: ['I', 'V', 'vi', 'IV'] },
      { title: "Don't Stop Believin'", artist: "Journey", genre: "rock", progression: ['I', 'V', 'vi', 'IV'] },
      { title: "No Woman, No Cry", artist: "Bob Marley", genre: "reggae", progression: ['I', 'V', 'vi', 'IV'] },
      { title: "With or Without You", artist: "U2", genre: "rock", progression: ['I', 'V', 'vi', 'IV'] },
      { title: "Someone Like You", artist: "Adele", genre: "pop", progression: ['I', 'V', 'vi', 'IV'] },
      { title: "Where Is the Love?", artist: "The Black Eyed Peas", genre: "pop", progression: ['I', 'V', 'vi', 'IV'] },
      { title: "Can You Feel the Love Tonight", artist: "Elton John", genre: "film score", progression: ['I', 'V', 'vi', 'IV'] },

      // Pop (vi–IV–I–V Sensitive Female Chord Progression)
      { title: "Complicated", artist: "Avril Lavigne", genre: "pop", progression: ['vi', 'IV', 'I', 'V'] },
      { title: "Grenade", artist: "Bruno Mars", genre: "pop", progression: ['vi', 'IV', 'I', 'V'] },
      { title: "Poker Face", artist: "Lady Gaga", genre: "pop", progression: ['vi', 'IV', 'I', 'V'] },
      { title: "Despacito", artist: "Luis Fonsi ft. Daddy Yankee", genre: "pop", progression: ['vi', 'IV', 'I', 'V'] },
      { title: "Hello", artist: "Adele", genre: "pop", progression: ['vi', 'IV', 'I', 'V'] },

      // 50s / Doo-Wop (I–vi–IV–V)
      { title: "Stand by Me", artist: "Ben E. King", genre: "r&b", progression: ['I', 'vi', 'IV', 'V'] },
      { title: "Every Breath You Take", artist: "The Police", genre: "rock", progression: ['I', 'vi', 'IV', 'V'] },
      { title: "Earth Angel", artist: "The Penguins", genre: "doo-wop", progression: ['I', 'vi', 'IV', 'V'] },
      { title: "Unchained Melody", artist: "The Righteous Brothers", genre: "pop", progression: ['I', 'vi', 'IV', 'V'] },

      // Rock & Alternative (I–bVII–IV Andalusian / Borrowed Variations)
      { title: "Creep", artist: "Radiohead", genre: "alternative", progression: ['I', 'iii', 'IV', 'iv'] },
      { title: "Sweet Home Alabama", artist: "Lynyrd Skynyrd", genre: "rock", progression: ['V', 'IV', 'I'] },
      { title: "Wonderwall", artist: "Oasis", genre: "britpop", progression: ['vi', 'bVII', 'IV', 'I'] },
      { title: "Hey Jude", artist: "The Beatles", genre: "rock", progression: ['I', 'V', 'V7', 'I', 'IV', 'I', 'V', 'I'] },

      // Jazz & Standards (ii–V–I)
      { title: "Autumn Leaves", artist: "Joseph Kosma / Jazz Standard", genre: "jazz", progression: ['ii', 'V7', 'Imaj7', 'IV'] },
      { title: "Fly Me to the Moon", artist: "Frank Sinatra", genre: "jazz", progression: ['vi', 'ii', 'V7', 'Imaj7'] },
      { title: "Sunday Morning", artist: "Maroon 5", genre: "pop", progression: ['ii', 'V', 'I'] }
    ];

    let currentKey = 'C';
    let activeProgression = [];

    const AudioContext = window.AudioContext || window.webkitAudioContext;
    const audioCtx = new AudioContext();

    function getRootNoteIndex(keyStr) {
      const cleanKey = NOTE_ALIASES[keyStr] || keyStr;
      return NOTES.indexOf(cleanKey);
    }

    function getAbsoluteChordName(roman, key) {
      const rootIndex = getRootNoteIndex(key);
      const semitones = CHORD_DEFINITIONS[roman].semitones;
      const noteIndex = (rootIndex + semitones) % 12;
      return NOTES[noteIndex];
    }

    function playChordAudio(roman) {
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }

      const rootIndex = getRootNoteIndex(currentKey);
      const chordDef = CHORD_DEFINITIONS[roman];
      const baseMidi = 60 + ((rootIndex + chordDef.semitones) % 12);

      chordDef.intervals.forEach(interval => {
        const midiNote = baseMidi + interval;
        const freq = 440 * Math.pow(2, (midiNote - 69) / 12);
        
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.2);
        
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        
        osc.start();
        osc.stop(audioCtx.currentTime + 1.2);
      });
    }

    function removeChordAt(index) {
      activeProgression.splice(index, 1);
      updateUI();
    }

    function renderButtons() {
      Object.keys(CHORD_GROUPS).forEach(groupKey => {
        const container = document.getElementById(`${groupKey}-grid`);
        container.innerHTML = '';
        
        CHORD_GROUPS[groupKey].forEach(roman => {
          const btn = document.createElement('button');
          btn.className = 'btn-chord';
          const absoluteName = getAbsoluteChordName(roman, currentKey);
          
          btn.innerHTML = `${roman} <span>${absoluteName}</span>`;
          btn.onclick = () => {
            playChordAudio(roman);
            activeProgression.push(roman);
            updateUI();
          };
          container.appendChild(btn);
        });
      });
    }

    function updateUI() {
      const display = document.getElementById('progression-display');
      display.innerHTML = '';

      if (activeProgression.length === 0) {
        display.innerHTML = `<span style="color: var(--text-muted);">Click chords below to build a progression...</span>`;
      } else {
        activeProgression.forEach((roman, index) => {
          const tag = document.createElement('div');
          tag.className = 'chord-tag';
          tag.title = 'Click to remove';
          tag.innerHTML = `${roman} <span>(${getAbsoluteChordName(roman, currentKey)})</span> ×`;
          tag.onclick = () => removeChordAt(index);
          display.appendChild(tag);
        });
      }

      findMatches();
    }

    // Sub-sequence Matcher (finds progressions embedded in longer sequences)
    function findMatches() {
      const matchesContainer = document.getElementById('matches-list');
      const matchCount = document.getElementById('match-count');
      
      if (activeProgression.length === 0) {
        matchesContainer.innerHTML = `<p style="color: var(--text-muted);">No matching songs found for this sequence yet.</p>`;
        matchCount.innerText = '0';
        return;
      }

      const userSeq = activeProgression.join(',');

      const matches = SONG_DATABASE.filter(song => {
        const songSeq = song.progression.join(',');
        // Matches exact sequence or looping sequence
        const doubleSongSeq = song.progression.concat(song.progression).join(',');
        return doubleSongSeq.includes(userSeq);
      });

      matchCount.innerText = matches.length;

      if (matches.length === 0) {
        matchesContainer.innerHTML = `<p style="color: var(--text-muted);">No verified matches found for this specific sequence.</p>`;
      } else {
        matchesContainer.innerHTML = matches.map(song => `
          <div class="match-item">
            <div>
              <div class="match-title">${song.title}</div>
              <div class="match-meta">${song.artist} — [ Progression: ${song.progression.join(' - ')} ]</div>
            </div>
            <span class="genre-badge">${song.genre}</span>
          </div>
        `).join('');
      }
    }

    document.getElementById('key-select').onchange = (e) => {
      currentKey = e.target.value;
      renderButtons();
      updateUI();
    };

    document.getElementById('btn-clear').onclick = () => {
      activeProgression = [];
      updateUI();
    };

    document.getElementById('btn-play').onclick = () => {
      activeProgression.forEach((roman, index) => {
        setTimeout(() => playChordAudio(roman), index * 600);
      });
    };

    renderButtons();
  </script>
</body>
</html>
