<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Music Matcher</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --danger: #f87171;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 2rem;
      display: flex;
      justify-content: center;
    }

    .container {
      max-width: 850px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    header {
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 2.2rem;
      color: var(--accent);
    }

    header p {
      color: var(--text-muted);
      margin-top: 0.5rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
    }

    .controls-row {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    select {
      background: var(--bg-color);
      color: var(--text-main);
      border: 1px solid var(--border);
      padding: 0.5rem 1rem;
      border-radius: 6px;
      font-size: 1rem;
      outline: none;
      cursor: pointer;
    }

    .progression-display {
      min-height: 50px;
      background: var(--bg-color);
      border: 1px dashed var(--border);
      border-radius: 8px;
      display: flex;
      align-items: center;
      padding: 0.5rem 1rem;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .chord-tag {
      background: var(--accent);
      color: #000;
      font-weight: bold;
      padding: 0.4rem 0.8rem;
      border-radius: 6px;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      cursor: pointer;
      user-select: none;
      transition: all 0.15s ease;
    }

    .chord-tag:hover {
      background: var(--danger);
      color: #ffffff;
    }

    .chord-tag span {
      font-size: 0.8rem;
      opacity: 0.75;
    }

    .chord-group {
      margin-top: 1rem;
    }

    .chord-group label {
      display: block;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
      gap: 0.5rem;
    }

    button.btn-chord {
      background: var(--bg-color);
      color: var(--text-main);
      border: 1px solid var(--border);
      padding: 0.75rem 0.5rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.15s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    button.btn-chord:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    button.btn-chord span {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .actions {
      display: flex;
      gap: 0.5rem;
      margin-top: 1rem;
    }

    .btn-action {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 0.4rem 0.8rem;
      border-radius: 6px;
      cursor: pointer;
    }

    .btn-action:hover {
      color: var(--text-main);
      border-color: var(--text-main);
    }

    .matches-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }
